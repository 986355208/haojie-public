name: Build and verify Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "game/**"
      - "music/**"
      - "scripts/build-apk-web.mjs"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
      - name: Prepare offline game assets
        run: node scripts/build-apk-web.mjs
      - name: Assemble release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android
      - name: Give the APK a friendly download name
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/haojie-happy-times.apk
      - name: Run game smoke test in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedDebugAndroidTest
          working-directory: android
      - name: Publish tested APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.0-${{ github.run_number }}
          name: "浩劫好时光 Android 试玩版 · ${{ github.run_number }}"
          body: |
            手机安装包由 GitHub Actions 自动构建。

            已通过 Android Emulator 启动测试：本地网页、兔子与宠物模型、Three.js 场景绘制。
          files: android/app/build/outputs/apk/release/haojie-happy-times.apk
          fail_on_unmatched_files: true
